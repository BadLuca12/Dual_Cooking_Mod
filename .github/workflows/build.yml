name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x marsstation-cooking-mod/gradlew

      - name: Build Mod
        run: cd marsstation-cooking-mod && ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cookingmod-jar
          path: marsstation-cooking-mod/build/libs/cookingmod-*.jar
